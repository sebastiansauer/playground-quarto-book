format:

  html:
    toc: true
    lang: de-DE
    theme:
      light: lumen
      dark: darkly
    css: styles.css
    number-sections: true
    df-print:  kable
    code-fold: true
    fig-align: center
    code-link: true
    code-annotations: true
    mermaid:
      theme: default
    out-width: 55%

